# wh configuration — see docs/plans/2026-07-19-warehouse-tools-design.md
# Secrets never live here: the password comes from $WH_WAREHOUSE_PWD.
sources:
  warehouse:
    driver: mssql
    server: localhost,1433
    database: ExecReporting
    encrypt: false # local dev server; defaults to true
    trust_server_certificate: true
    auth:
      user: sa
      password_env: WH_WAREHOUSE_PWD

destination:
  duckdb_path: ./metrics.duckdb
  parquet_dir: ./parquet

push:
  allow: # push() refuses anything not listed here
    - ExecReporting.dbo # dev sandbox; point at your real sandbox schema(s)

defaults:
  mode: native # native | parquet
  schema_in_duckdb: core
  compression: zstd
  compression_level: 9
  batch_size: 100000

tables:
  - name: outpatient_waitlist_current
    description: "Current Outpatient Waitlist"
    schema_in_duckdb: main
    source:
      database: ExecReporting
      schema: dbo
      table: OutpatientWaitsCurrent

  - name: outpatient_waitlist_snapshot
    description: "Daily waitlist snapshot"
    schema_in_duckdb: main
    source:
      query: >
        SELECT * FROM [ExecReporting].[dbo].[OutpatientWaitsPatientLevel]
