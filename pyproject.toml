[project]
name = "warehouse-tools"
version = "0.1.0"
description = "Helpers for mirroring warehouse data into DuckDB and pushing results back"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.4",
    "mssql-python>=1.11.0",
    "narwhals>=2.24.0",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
excel = ["python-calamine>=0.5"]
semantics = [
    "boring-semantic-layer>=0.3.15,<0.4",
    "ibis-framework[duckdb]>=12",
]

[project.scripts]
wh = "wh.cli:main"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wh"

[tool.pytest.ini_options]
filterwarnings = [
    # ibis 12.x internally calls duckdb's deprecated fetch_arrow_table()
    "ignore:fetch_arrow_table\\(\\) is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "boring-semantic-layer>=0.3.15,<0.4",
    "ibis-framework[duckdb]>=12.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pytest>=8",
    "python-calamine>=0.8.2",
]
