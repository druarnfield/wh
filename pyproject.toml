[project]
name = "warehouse-tools"
version = "0.1.0"
description = "Helpers for mirroring warehouse data into DuckDB and pushing results back"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.4",
    "mssql-python>=1.11.0",
    "narwhals>=2.24.0",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
excel = ["python-calamine>=0.5"]

[project.scripts]
wh = "wh.cli:main"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wh"

[dependency-groups]
dev = [
    "hypothesis>=6.158.0",
    "marimo>=0.23.14",
    "mutmut>=3.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pytest>=8",
    "python-calamine>=0.8.2",
]

[tool.pytest.ini_options]
addopts = "--ignore=mutants"    # mutmut's scratch copy of the repo
markers = [
    "fuzz: generative (Hypothesis) tests — budget controlled by HYPOTHESIS_PROFILE",
]

# mutmut 3.x keys (paths_to_mutate/tests_dir are the deprecated 2.x names).
# Stage runs per module: uv run mutmut run "wh.metrics.timegrain.*"
[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/wh/metrics/*"]
pytest_add_cli_args = ["-m", "not fuzz"]
pytest_add_cli_args_test_selection = ["tests/metrics"]
