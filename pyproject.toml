[project]
name = "warehouse-tools"
version = "0.1.0"
description = "Helpers for mirroring warehouse data into DuckDB and pushing results back"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.4",
    "mssql-python>=1.11.0",
    "narwhals>=2.24.0",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
wh = "wh.cli:main"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wh"

[dependency-groups]
dev = [
    "pandas>=3.0.3",
    "polars>=1.42.1",
    "pytest>=8",
]
